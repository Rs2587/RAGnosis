<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RAGnosis</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            color: #6b7280;
            font-size: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card h2 {
            margin-bottom: 20px;
        }

        input[type="file"] {
            width: 100%;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            resize: vertical;
            font-size: 16px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 12px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .delete-btn {
            background: #dc2626;
            padding: 7px 12px;
            margin-top: 0;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .document {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .answer {
            margin-top: 20px;
            padding: 20px;
            background: #f0fdf4;
            border-radius: 10px;
            line-height: 1.6;
        }

        .source {
            margin-top: 10px;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            font-size: 14px;
        }

        .status {
            margin-top: 15px;
            color: #2563eb;
        }

        @media (max-width: 800px) {

            .grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <header>

        <h1>RAGnosis</h1>

        <p>
            AI-Powered Document Question Answering
        </p>

    </header>


    <div class="grid">

        <!-- Upload -->

        <div class="card">

            <h2>Upload Document</h2>

            <input
                type="file"
                id="pdfFile"
                accept=".pdf"
            >

            <button onclick="uploadPDF()">
                Upload PDF
            </button>

            <div
                id="uploadStatus"
                class="status">
            </div>

        </div>


        <!-- Documents -->

        <div class="card">

            <h2>Documents</h2>

            <div id="documents">
                Loading...
            </div>

        </div>

    </div>


    <!-- Ask -->

    <div class="card">

        <h2>Ask a Question</h2>

        <textarea
            id="question"
            placeholder="Ask something about your documents..."
        ></textarea>

        <button onclick="askQuestion()">
            Ask Question
        </button>


        <div
            id="answerSection"
            style="display:none;"
        >

            <h2 style="margin-top:30px;">
                Answer
            </h2>

            <div
                id="answer"
                class="answer">
            </div>


            <h3 style="margin-top:25px;">
                Sources
            </h3>

            <div id="sources"></div>

        </div>

    </div>

</div>


<script>

const API_URL = "";


async function loadDocuments() {

    try {

        const response =
            await fetch(`${API_URL}/documents`);

        const data =
            await response.json();

        const container =
            document.getElementById("documents");

        container.innerHTML = "";

        if (data.documents.length === 0) {

            container.innerHTML =
                "<p>No documents uploaded.</p>";

            return;
        }

        data.documents.forEach(filename => {

            const div =
                document.createElement("div");

            div.className = "document";

            div.innerHTML = `
                <span>${filename}</span>

                <button
                    class="delete-btn"
                    onclick="deleteDocument('${filename}')">
                    Delete
                </button>
            `;

            container.appendChild(div);

        });

    }

    catch (error) {

        document.getElementById("documents").innerText =
            "Unable to load documents.";

    }

}


async function uploadPDF() {

    const fileInput =
        document.getElementById("pdfFile");

    const status =
        document.getElementById("uploadStatus");

    if (!fileInput.files.length) {

        status.innerText =
            "Please select a PDF.";

        return;
    }

    const formData =
        new FormData();

    formData.append(
        "file",
        fileInput.files[0]
    );

    status.innerText =
        "Uploading and indexing...";

    try {

        const response =
            await fetch(
                `${API_URL}/upload`,
                {
                    method: "POST",
                    body: formData
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            status.innerText =
                data.detail || "Upload failed.";

            return;
        }

        status.innerText =
            "PDF uploaded successfully.";

        fileInput.value = "";

        loadDocuments();

    }

    catch (error) {

        status.innerText =
            "Upload failed.";

    }

}


async function askQuestion() {

    const question =
        document
        .getElementById("question")
        .value
        .trim();

    if (!question) {

        alert("Please enter a question.");

        return;
    }

    const answerSection =
        document.getElementById("answerSection");

    const answer =
        document.getElementById("answer");

    const sources =
        document.getElementById("sources");

    answerSection.style.display =
        "block";

    answer.innerText =
        "Thinking...";

    sources.innerHTML = "";

    try {

        const response =
            await fetch(
                `${API_URL}/ask`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })
                }
            );

        const data =
            await response.json();

        answer.innerText =
            data.answer;

        data.sources.forEach(source => {

            const div =
                document.createElement("div");

            div.className =
                "source";

            div.innerText =
                `${source.document} • Page ${source.page} • Score ${source.score}`;

            sources.appendChild(div);

        });

    }

    catch (error) {

        answer.innerText =
            "Something went wrong.";

    }

}


async function deleteDocument(filename) {

    const confirmed =
        confirm(
            `Delete ${filename}?`
        );

    if (!confirmed) {
        return;
    }

    try {

        const response =
            await fetch(
                `/documents/${encodeURIComponent(filename)}`,
                {
                    method: "DELETE"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.detail ||
                "Delete failed."
            );

            return;
        }

        loadDocuments();

    }

    catch (error) {

        alert(
            "Unable to delete document."
        );

    }

}


loadDocuments();

</script>


</body>

</html>
